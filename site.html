<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMC - Site principal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-fade-up {
        animation: fade-up 700ms ease-out both;
      }
    </style>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-neutral-50 via-white to-rose-50 text-neutral-900">
    <main class="flex min-h-screen items-center justify-center px-6">
      <div class="animate-fade-up rounded-full border border-neutral-200 bg-white/80 px-6 py-3 text-center shadow-sm backdrop-blur-sm">
        <p class="text-[10px] font-semibold uppercase tracking-[0.35em] text-neutral-400">Site principal</p>
      </div>
    </main>
  </body>
</html>
